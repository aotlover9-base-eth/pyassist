name: Bug Report
description: Report a reproducible bug in pyassist
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report an issue!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Run 'pyassist'
        2. Press '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS (Linux, macOS, Windows), Python version, Terminal emulator.
      placeholder: Ubuntu 24.04 / Python 3.12 / Alacritty
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log Output or Screenshots
      description: Paste any error messages or tracebacks from ~/.local/share/pyassist/pyassist.log (or %APPDATA%\pyassist).
