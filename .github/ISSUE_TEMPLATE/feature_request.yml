name: Feature Request
description: Suggest an idea or enhancement for pyassist
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Have an idea to make pyassist even better? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or user experience you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
